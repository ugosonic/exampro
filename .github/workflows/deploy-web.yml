name: Deploy Web to VPS

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "assets/**"
      - "web/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build web (production)
        run: flutter build web --release --dart-define=ENVIRONMENT=production --no-wasm-dry-run

      - name: Package web build
        run: tar -czf web.tar.gz -C build/web .

      - name: Check SSH reachability
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          python - <<'PY'
          import os, socket, sys
          host = os.environ.get("VPS_HOST", "").strip()
          port = int(os.environ.get("VPS_PORT", "22"))
          if not host:
              print("VPS_HOST secret is empty")
              sys.exit(1)
          s = socket.socket()
          s.settimeout(10)
          try:
              s.connect((host, port))
              print(f"SSH reachable on {host}:{port}")
          except Exception as e:
              print(f"SSH not reachable on {host}:{port} -> {e}")
              sys.exit(1)
          finally:
              s.close()
          PY

      - name: Upload web package to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          timeout: 120s
          command_timeout: 20m
          debug: true
          source: "web.tar.gz"
          target: "/tmp"

      - name: Deploy package on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          timeout: 120s
          command_timeout: 30m
          script: |
            set -e
            WEB_ROOT="${{ secrets.VPS_WEB_ROOT }}"
            if [ -z "$WEB_ROOT" ]; then WEB_ROOT="/var/www/citizentest-web"; fi
            sudo mkdir -p "$WEB_ROOT"
            sudo find "$WEB_ROOT" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            sudo tar -xzf /tmp/web.tar.gz -C "$WEB_ROOT"
            sudo chown -R www-data:www-data "$WEB_ROOT"
            sudo chmod -R a+rX "$WEB_ROOT"
            sudo systemctl reload nginx
