name: Deploy API to VPS

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package API deployment bundle
        run: |
          tar -czf api-deploy.tar.gz docker-compose.yml server

      - name: Upload API bundle to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          source: "api-deploy.tar.gz"
          target: "/tmp"

      - name: Deploy API on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            set -e
            APP_DIR="${{ secrets.VPS_DIR }}"
            if [ -z "$APP_DIR" ]; then APP_DIR="/opt/citizentest/app"; fi
            sudo mkdir -p "$APP_DIR"
            sudo tar -xzf /tmp/api-deploy.tar.gz -C "$APP_DIR"
            cd "$APP_DIR"
            if [ ! -f .env ]; then
              echo "ERROR: $APP_DIR/.env is missing. Create it on VPS first."
              exit 1
            fi
            docker compose pull || true
            docker compose up -d --build
            docker system prune -f

