name: Deploy API to VPS

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package API deployment bundle
        run: |
          tar -czf api-deploy.tar.gz docker-compose.yml server

      - name: Check SSH reachability
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          python - <<'PY'
          import os, socket, sys
          host = os.environ.get("VPS_HOST", "").strip()
          port = int(os.environ.get("VPS_PORT", "22"))
          if not host:
              print("VPS_HOST secret is empty")
              sys.exit(1)
          s = socket.socket()
          s.settimeout(10)
          try:
              s.connect((host, port))
              print(f"SSH reachable on {host}:{port}")
          except Exception as e:
              print(f"SSH not reachable on {host}:{port} -> {e}")
              sys.exit(1)
          finally:
              s.close()
          PY

      - name: Upload API bundle to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          timeout: 120s
          command_timeout: 20m
          debug: true
          source: "api-deploy.tar.gz"
          target: "/tmp"

      - name: Deploy API on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          timeout: 120s
          command_timeout: 30m
          script: |
            set -e
            APP_DIR="${{ secrets.VPS_DIR }}"
            if [ -z "$APP_DIR" ]; then APP_DIR="/opt/citizentest/app"; fi
            sudo mkdir -p "$APP_DIR"
            sudo tar -xzf /tmp/api-deploy.tar.gz -C "$APP_DIR"
            cd "$APP_DIR"
            if [ ! -f .env ]; then
              echo "ERROR: $APP_DIR/.env is missing. Create it on VPS first."
              exit 1
            fi
            docker compose pull || true
            docker compose up -d --build
            docker system prune -f

