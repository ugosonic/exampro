services:
  api:
    build:
      context: ./server/express
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL}
      - SYNC_ADMIN_TOKEN=${SYNC_ADMIN_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - UPLOAD_DIR=/data/uploads
    volumes:
      - ./server/uploads:/data/uploads
