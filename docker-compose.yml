services:
  api:
    build:
      context: ./server/express
    restart: unless-stopped
    network_mode: "host"
    environment:
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL}
      - SYNC_ADMIN_TOKEN=${SYNC_ADMIN_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - UPLOAD_DIR=/data/uploads
    volumes:
      - ./server/uploads:/data/uploads