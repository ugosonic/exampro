services:
  api:
    build:
      context: ./server/express
    restart: unless-stopped
    environment:
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL}
      - SYNC_ADMIN_TOKEN=${SYNC_ADMIN_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - UPLOAD_DIR=/data/uploads
    networks: [web]
    volumes:
      - ./server/uploads:/data/uploads
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./server/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./server/media:/srv/media
    networks: [web]
networks:
  web:
    driver: bridge
volumes:
  caddy_data:
  caddy_config:
